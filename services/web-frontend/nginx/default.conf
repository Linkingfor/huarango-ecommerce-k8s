# nginx del contenedor web-frontend.
# Sirve la SPA y reenvía /api/* al microservicio que corresponde. Los nombres (svc-usuarios, svc-catalogo...)
# son los mismos en docker compose y en Kubernetes, así que esta configuración sirve en ambos.
# En AWS, con el Ingress (APF3), el ALB envía /api/* directo a cada servicio y este proxy queda como respaldo.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 5m;
  server_tokens off;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location /api/usuarios/ { proxy_pass http://svc-usuarios:3001; }
  location /api/catalogo/ { proxy_pass http://svc-catalogo:3002; }
  location /media/        { proxy_pass http://svc-catalogo:3002; }
  location /api/carrito   { proxy_pass http://svc-carrito:3003; }
  location /api/ordenes   { proxy_pass http://svc-ordenes:3004; }
  location /api/pagos/    { proxy_pass http://svc-pagos:3005; }

  # Archivos con hash en el nombre: se pueden guardar un año en caché.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html sin caché para que cada despliegue se vea de inmediato.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
