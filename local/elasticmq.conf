# Colas locales que imitan a Amazon SQS. Mismos nombres, visibilidad y colas de mensajes fallidos que en AWS.
include classpath("application.conf")

node-address {
  protocol = http
  host = sqs
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  cola-pagos {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "cola-pagos-dlq"
      maxReceiveCount = 5
    }
  }
  cola-pagos-dlq {}

  q-ordenes-estado {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "q-ordenes-estado-dlq"
      maxReceiveCount = 5
    }
  }
  q-ordenes-estado-dlq {}

  q-notificaciones {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "q-notificaciones-dlq"
      maxReceiveCount = 5
    }
  }
  q-notificaciones-dlq {}
}
